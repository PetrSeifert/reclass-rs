<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reclass-rs · Constellation</title>
<style>
  :root {
    --bg: #0a0c11; --glass: rgba(20, 23, 31, .78); --card: #131720; --card2: #181d28; --edge: #262c3a; --edge2: #343b4d;
    --text: #e3e7f0; --dim: #8a93a8; --faint: #525b70; --accent: #8b7bff; --accent2: #3ad0c9; --good: #3ddc97; --bad: #ff6b7d;
    --k-hex: #6b7489; --k-int: #3ddc97; --k-uint: #3ddc97; --k-float: #ffb86b; --k-vec: #ffd86b; --k-ptr: #b39bff; --k-text: #3ad0c9; --k-enum: #6bb6ff; --k-bool: #ff8fc8; --k-class: #3ad0c9; --k-array: #3ad0c9;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; --ui: Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px var(--ui); overflow: hidden; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #stage { position: fixed; inset: 0; cursor: grab; background-color: var(--bg);
    background-image: radial-gradient(circle, #1c2130 1.2px, transparent 1.3px); }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #wires path { fill: none; stroke-width: 2; }
  #wires .lbl { font: 10px var(--mono); fill: var(--dim); }

  .node { position: absolute; width: 360px; background: var(--card); border: 1px solid var(--edge); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.02) inset; cursor: default; }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.25), 0 10px 40px rgba(0,0,0,.5); }
  .node.pulse { animation: pulse 1s; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(139,123,255,.8); } 100% { box-shadow: 0 0 0 20px rgba(139,123,255,0); } }
  .nh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: grab; border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--edge); background: linear-gradient(180deg, color-mix(in srgb, var(--hue) 16%, transparent), transparent); }
  .nh .gl { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--hue) 25%, #0000); color: var(--hue); font-size: 12px; font-weight: 700; }
  .nh .nm { font-weight: 650; font-size: 13px; }
  .nh .via { color: var(--dim); font-size: 11px; }
  .nh .ad { margin-left: auto; font: 11px var(--mono); color: var(--dim); }
  .nh .x { border: none; background: none; color: var(--faint); width: 20px; height: 20px; border-radius: 5px; }
  .nh .x:hover { background: #ffffff14; color: var(--text); }
  .nh .root { font-size: 9px; letter-spacing: .08em; background: var(--accent); color: #fff; padding: 1px 5px; border-radius: 4px; }
  .nb { padding: 4px 0 6px; }
  .r { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; column-gap: 8px; padding: 0 22px 0 12px; height: 24px; position: relative; font-size: 12px; }
  .r:hover { background: #ffffff06; }
  .r.on { background: rgba(139,123,255,.12); }
  .r .o { font: 10px var(--mono); color: var(--faint); }
  .r .nm { display: flex; gap: 6px; align-items: baseline; min-width: 0; overflow: hidden; white-space: nowrap; }
  .r .nm .n { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .r .nm .n.anon { color: var(--faint); }
  .r .nm .t { font: 10px var(--mono); flex: none; }
  .r .nm .tg { color: var(--dim); width: 10px; flex: none; cursor: pointer; }
  .r .v { font: 11.5px var(--mono); color: #cfd5e2; text-align: right; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .v.err { color: var(--bad); }
  .r .v.flash { animation: fl .8s; }
  @keyframes fl { from { color: #fff; text-shadow: 0 0 8px var(--accent2); background: rgba(58,208,201,.2); } }
  .r .port { position: absolute; right: -7px; top: 5px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--k-ptr); background: var(--card); cursor: pointer; z-index: 2; }
  .r .port:hover { transform: scale(1.25); }
  .r .port.open { background: var(--k-ptr); }
  .r .port.enc { border-color: var(--accent2); border-style: dashed; }
  .r .port.enc.open { background: var(--accent2); }
  .r .port.null { border-color: var(--faint); cursor: not-allowed; }
  .r .port.known { background: radial-gradient(circle, var(--k-ptr) 0 2.5px, var(--card) 3px); border-style: dotted; }
  .r .port.stale { border-color: var(--bad); background: var(--bad); animation: blinkp 1.2s infinite; }
  @keyframes blinkp { 50% { box-shadow: 0 0 0 4px rgba(255,107,125,.25); } }
  .nh .refs { font: 10px var(--mono); color: var(--accent2); border: 1px solid color-mix(in srgb, var(--accent2) 40%, transparent); border-radius: 4px; padding: 0 4px; }
  .nh .dup { font-size: 10px; color: #ffb86b; border: 1px solid #ffb86b66; border-radius: 4px; padding: 0 5px; cursor: pointer; }
  .nh .dup:hover { background: #ffb86b22; }
  .r .bar { position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; }
  .nf { display: flex; gap: 6px; padding: 6px 12px 10px; border-top: 1px solid var(--edge); }
  .nf button { border: 1px solid var(--edge2); background: transparent; color: var(--dim); border-radius: 7px; padding: 3px 8px; font-size: 11px; }
  .nf button:hover { color: var(--text); border-color: var(--accent); }
  .inline-edit { background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; font: 12px var(--ui); outline: none; padding: 0 4px; height: 19px; }

  .glass { position: fixed; background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.4); z-index: 10; }
  .brand { top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 8px; background: radial-gradient(circle at 30% 30%, #fff 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 40% 75%, #fff 0 1px, transparent 2px), linear-gradient(135deg, var(--accent), var(--accent2)); }
  .brand b { font-size: 13px; }
  .brand .proc { display: flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; background: #ffffff0a; cursor: pointer; }
  .brand .proc:hover { background: #ffffff14; }
  .brand .proc i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
  .toolbar { top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; }
  .toolbar .expr { display: flex; align-items: center; gap: 8px; background: #00000040; border: 1px solid var(--edge); border-radius: 9px; padding: 0 10px; height: 32px; }
  .toolbar .expr:focus-within { border-color: var(--accent); }
  .toolbar .expr.bad { border-color: var(--bad); }
  .toolbar .expr input { background: none; border: none; outline: none; color: var(--text); font: 12px var(--mono); width: 130px; }
  .toolbar .expr .res { font: 11px var(--mono); color: var(--good); }
  .toolbar .expr .res.bad { color: var(--bad); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar select { background: #00000040; border: 1px solid var(--edge); color: var(--text); border-radius: 9px; height: 32px; padding: 0 8px; font: 12px var(--ui); outline: none; }
  .tbtn { white-space: nowrap; height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  .tbtn:hover { background: #ffffff0f; color: var(--text); }
  .tbtn.on { color: var(--good); }
  .vsep { width: 1px; height: 20px; background: var(--edge2); margin: 0 4px; }

  .lib { top: 76px; left: 14px; width: 230px; max-height: calc(100vh - 100px); overflow: auto; padding: 8px; }
  .lib h5 { margin: 8px 6px 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: flex; }
  .lib h5 button { margin-left: auto; border: none; background: none; color: var(--dim); padding: 0; }
  .lib h5 button:hover { color: var(--accent); }
  .li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .li:hover { background: #ffffff0a; }
  .li .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .li .m { margin-left: auto; font: 10px var(--mono); color: var(--faint); }
  .li.unused { opacity: .5; }
  .li .cnt { font-size: 10px; color: var(--accent); }

  .insp { top: 76px; right: 14px; width: 280px; padding: 14px; max-height: calc(100vh - 250px); overflow: auto; }
  .insp .big { font: 18px var(--mono); word-break: break-all; margin: 4px 0 2px; }
  .insp .sub { color: var(--dim); font-size: 11px; }
  .insp .lab { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 14px 0 6px; }
  .insp .grid2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font: 11px var(--mono); }
  .insp .grid2 span:nth-child(odd) { color: var(--dim); }
  .insp .grid2 span:nth-child(even) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insp select, .insp input { width: 100%; background: #00000040; border: 1px solid var(--edge); color: var(--text); border-radius: 8px; padding: 6px 8px; font: 12px var(--mono); outline: none; margin-bottom: 6px; }
  .insp .typegrid { display: flex; flex-wrap: wrap; gap: 4px; }
  .insp .typegrid button { border: 1px solid var(--edge2); background: transparent; border-radius: 6px; padding: 3px 7px; font: 10.5px var(--mono); color: var(--dim); }
  .insp .typegrid button:hover { border-color: var(--accent); color: var(--text); }
  .insp .typegrid button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .insp .empty { color: var(--dim); line-height: 1.7; }
  kbd { font: 10px var(--mono); padding: 1px 5px; border: 1px solid var(--edge2); border-bottom-width: 2px; border-radius: 4px; color: var(--text); }

  .mini { bottom: 14px; right: 14px; width: 200px; height: 130px; padding: 0; overflow: hidden; }
  .mini canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
  .zoom { bottom: 14px; right: 224px; display: flex; align-items: center; padding: 4px; }
  .zoom span { font: 11px var(--mono); color: var(--dim); width: 44px; text-align: center; }
  .hint { bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 14px; color: var(--dim); font-size: 11px; border-radius: 999px; }

  .modal { position: fixed; inset: 0; background: rgba(5,6,10,.55); display: none; place-items: center; z-index: 90; }
  .modal.show { display: grid; }
  .modal .box { width: 380px; max-height: 60vh; display: flex; flex-direction: column; position: static; padding: 10px; }
  .modal input { background: #00000040; border: 1px solid var(--edge); color: var(--text); border-radius: 9px; padding: 9px 12px; font: 13px var(--ui); outline: none; margin-bottom: 6px; }
  .modal .list { overflow: auto; }

  .cm { background: rgba(22, 26, 35, .96); backdrop-filter: blur(14px); border: 1px solid var(--edge2); border-radius: 12px; box-shadow: 0 16px 50px rgba(0,0,0,.5); padding: 5px; min-width: 210px; font: 12.5px var(--ui); color: var(--text); }
  .cm-item { display: flex; align-items: center; padding: 6px 24px 6px 26px; border-radius: 7px; position: relative; white-space: nowrap; cursor: default; }
  .cm-item:hover { background: linear-gradient(90deg, rgba(139,123,255,.35), rgba(139,123,255,.15)); }
  .cm-hint { margin-left: auto; padding-left: 20px; color: var(--dim); font: 10.5px var(--mono); }
  .cm-arrow { position: absolute; right: 9px; color: var(--dim); }
  .cm-checked::before { content: ''; position: absolute; left: 10px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--accent2); }
  .cm-danger .cm-label { color: var(--bad); }
  .cm-disabled { opacity: .4; }
  .cm-sep { height: 1px; background: var(--edge); margin: 4px 6px; }
  .cm-header { padding: 4px 10px 6px; color: var(--faint); font: 10.5px var(--mono); }
  .cm-sub { display: none; position: absolute; left: calc(100% + 4px); top: -6px; }
  .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 12px; opacity: 0; transition: .2s; pointer-events: none; z-index: 1000; box-shadow: 0 6px 24px rgba(139,123,255,.4); }
  .toast.show { opacity: 1; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--edge2); border-radius: 4px; }
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="wires"><defs>
  <linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="#b39bff"/><stop offset="1" stop-color="#6bb6ff"/></linearGradient>
  <linearGradient id="ge" x1="0" x2="1"><stop offset="0" stop-color="#3ad0c9"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
</defs><g id="wg"></g></svg></div></div>

<div class="glass brand"><div class="logo"></div><b>constellation</b><div class="proc" id="proc"></div></div>
<div class="glass toolbar">
  <select id="rootCls" title="Root class"></select>
  <div class="expr" id="exprBox"><span style="color:var(--faint)">@</span><input id="expr" spellcheck="false"><span class="res" id="exprRes"></span></div>
  <div class="vsep"></div>
  <button class="tbtn on" id="live" title="Live updates">● Live</button>
  <button class="tbtn" id="tidy" title="Auto-layout">⌘ Tidy</button>
  <button class="tbtn" id="fit" title="Fit to screen (F)">⤢ Fit</button>
  <button class="tbtn" id="collapse" title="Close all but root">⊖</button>
  <div class="vsep"></div>
  <button class="tbtn" id="share" title="When on, following a pointer to an instance that is already open links to that card instead of opening a copy"></button>
  <button class="tbtn" id="churn" title="Demo: rotate the entity list every 2.5 s so pointers change under open cards">⇄ Churn</button>
</div>
<div class="glass lib" id="lib"></div>
<div class="glass insp" id="insp"></div>
<div class="glass zoom"><button class="tbtn" id="zOut">−</button><span id="zLbl">100%</span><button class="tbtn" id="zIn">＋</button></div>
<div class="glass mini"><canvas id="mini" width="400" height="260"></canvas></div>
<div class="glass hint" id="hint">Click a <b style="color:var(--k-ptr)">●</b> port to follow a pointer · drag canvas to pan · wheel to zoom · right-click fields</div>
<div class="modal" id="modal"><div class="glass box"><input id="mq" placeholder="Attach to process…"><div class="list" id="ml"></div></div></div>

<script src="../shared/model.js"></script>
<script src="../shared/ui.js"></script>
<script>
const M = Model, $ = s => document.querySelector(s), esc = UI.esc;
const HUES = ['#8b7bff', '#3ad0c9', '#ffb86b', '#ff8fc8', '#6bb6ff', '#3ddc97', '#ffd86b'];
const hue = cid => HUES[(cid - 1) % HUES.length];
const NODE_W = 360;

// view state
let view = { x: 280, y: 110, k: 0.9 };
let nodes = [], nid = 1, selNode = null, selKey = null;
// "Share cards": following a pointer to an instance that is already on the
// canvas links to that card instead of opening a copy.
let shareCards = localStorage.getItem('constellation.share') !== 'off';

// A card is "the instance of class C at address A". Its links are the pointer
// ports ({ nodeId, key }) that were followed to reach it. links[0] is the anchor:
// its live value drives the card's address. The other links are aliases, which
// are only drawn as wires. They go stale (red) if their pointer moves away, but
// never move or close the card, so pointer churn cannot rearrange the canvas.
function makeNode(link, x, y) { const n = { id: nid++, links: link ? [link] : [], x, y, expanded: new Set(), el: null, rows: [], sig: '' }; nodes.push(n); return n; }
const root = makeNode(null, 0, 0);
root.isRoot = true;

const isPtr = d => d.type === 'Pointer' || d.type === 'EncryptedPointer';
const byId = id => nodes.find(x => x.id === id);
const sameInst = (a, b) => !!a && !!b && a.classId === b.classId && a.base === b.base;
const anchorOf = n => (n.isRoot ? null : n.links[0]);
const linkedHere = (nodeId, key) => nodes.find(n => n.links.some(l => l.nodeId === nodeId && l.key === key));
// Live target of a pointer port: { classId, base, d } or null.
function portTarget(l) {
  const p = byId(l.nodeId), r = p && p.rows.find(r => r.key === l.key);
  return r && r.d.child && r.d.child.classId ? { classId: r.d.child.classId, base: r.d.child.base, d: r.d } : null;
}
const linkOk = (l, n) => sameInst(portTarget(l), n);
// Remove a link; if it was the anchor, promote an alias that still reaches this
// instance. With none left the card is orphaned and closes on the next resolve.
function dropLink(n, i) {
  n.links.splice(i, 1);
  if (i === 0 && !n.isRoot && n.links.length) {
    const j = n.links.findIndex(l => linkOk(l, n));
    if (j < 0) n.links = [];
    else n.links.unshift(n.links.splice(j, 1)[0]);
  }
}

function setup(n, t) {
  n.classId = t.classId; n.base = t.base; n.via = t.d.name; n.enc = t.d.type === 'EncryptedPointer';
  n.rows = UI.flatten(n.classId, n.base, n.expanded, d => isPtr(d));
}
// Resolve cards parent-first. A card whose anchor no longer resolves is
// re-anchored on a surviving alias, otherwise it is closed.
function resolveAll() {
  root.classId = M.state.rootClassId; root.base = M.rootAddress(); root.via = null; root.enc = false;
  root.rows = UI.flatten(root.classId, root.base, root.expanded, d => isPtr(d));
  const done = new Set([root]);
  for (;;) {
    let progress = false;
    for (const n of nodes) {
      if (done.has(n) || !n.links.length) continue;
      const src = byId(n.links[0].nodeId);
      if (!src || !done.has(src)) continue;
      const t = portTarget(n.links[0]);
      if (t) { setup(n, t); done.add(n); progress = true; }
    }
    if (progress) continue;
    // stuck: promote an alias whose source is resolved and still reaches the card
    for (const n of nodes) {
      if (done.has(n)) continue;
      const j = n.links.findIndex((l, i) => i > 0 && done.has(byId(l.nodeId)) && linkOk(l, n));
      if (j > 0) { n.links.unshift(n.links.splice(j, 1)[0]); progress = true; break; }
    }
    if (progress) continue;
    const dead = nodes.filter(n => !done.has(n));
    if (!dead.length) break;
    dead.forEach(removeNode);
  }
  // two anchors that lead to the same instance → offer a merge (never automatic)
  nodes.forEach(n => { n.dupOf = shareCards ? nodes.find(o => o !== n && o.id < n.id && sameInst(o, n)) || null : null; });
}
function removeNode(n) {
  nodes = nodes.filter(x => x !== n);
  n.el && n.el.remove();
  if (selNode === n.id) { selNode = null; selKey = null; }
  nodes.forEach(o => { for (let i = o.links.length - 1; i >= 0; i--) if (o.links[i].nodeId === n.id) dropLink(o, i); });
}
function closeNode(n, silent) { if (n.isRoot) return; removeNode(n); if (!silent) render(true); }
function closeAll() { nodes.slice().forEach(n => { if (!n.isRoot) removeNode(n); }); root.links = []; }
// Fold card n into card o (same instance): its wires and children move over.
function merge(n, o) {
  n.links.forEach(l => { if (!o.links.some(x => x.nodeId === l.nodeId && x.key === l.key)) o.links.push(l); });
  n.expanded.forEach(k => o.expanded.add(k));
  nodes.forEach(x => x.links.forEach(l => { if (l.nodeId === n.id) l.nodeId = o.id; }));
  nodes = nodes.filter(x => x !== n); n.el && n.el.remove();
  if (selNode === n.id) selNode = o.id;
  render(true); focusNode(o);
}

function portState(n, r) {
  const d = r.d;
  if (!isPtr(d) || !d.field.target || !d.field.target.classId) return null;
  if (!d.expandable) return { cls: 'null', title: 'null / invalid pointer' };
  const here = { nodeId: n.id, key: r.key }, L = linkedHere(n.id, r.key);
  if (L) return linkOk(here, L)
    ? { cls: 'open', title: 'Open — click to unlink' }
    : { cls: 'stale', title: 'Pointer moved away from the linked card — click to re-follow' };
  const t = portTarget(here), ex = shareCards && nodes.find(x => sameInst(x, t));
  if (ex) return { cls: 'known', title: 'Already on canvas (' + M.getClass(ex.classId).name + ' @ ' + M.hex(ex.base) + ') — click to link' };
  return { cls: '', title: 'Follow pointer' };
}

function nodeHtml(n) {
  const c = M.getClass(n.classId);
  const rows = n.rows.map(r => {
    const d = r.d, f = d.field;
    const tg = !isPtr(d) && d.expandable ? `<span class="tg" data-tg>${r.open ? '▾' : '▸'}</span>` : '';
    const nm = f.name ? `<span class="n" data-name>${esc(f.name)}</span>` : `<span class="n anon" data-name>${M.SHORT[f.type]}</span>`;
    const pad = r.depth ? `style="padding-left:${12 + r.depth * 14}px"` : '';
    const ps = portState(n, r);
    const port = ps ? `<span class="port ${d.type === 'EncryptedPointer' ? 'enc' : ''} ${ps.cls}" data-port title="${esc(ps.title)}"></span>` : '';
    return `<div class="r ${n.id === selNode && r.key === selKey ? 'on' : ''}" data-k="${r.key}" ${pad}><span class="bar" style="background:var(--k-${d.cat});opacity:${d.cat === 'hex' ? .3 : .9}"></span>
      <span class="o">${M.hex(d.offset, 3)}</span><span class="nm">${tg}${nm}<span class="t" style="color:var(--k-${d.cat})">${esc(d.typeLabel)}</span></span>
      <span class="v ${d.error ? 'err' : ''}" data-v title="${esc(d.hints.join(' · '))}">${esc(d.value)}</span>${port}</div>`;
  }).join('');
  const aliases = n.links.length - (n.isRoot ? 0 : 1);
  return `<div class="nh" data-drag><span class="gl">${esc(c.name[0])}</span><span class="nm">${esc(c.name)}</span>
      ${n.isRoot ? '<span class="root">ROOT</span>' : `<span class="via">via ${esc(n.via)}${n.enc ? ' 🔒' : ''}</span>`}
      ${aliases > 0 ? `<span class="refs" title="${aliases} more pointer(s) lead to this card">+${aliases}</span>` : ''}
      ${n.dupOf ? '<span class="dup" data-merge title="Another card shows the same instance — click to merge">⧉ merge</span>' : ''}
      <span class="ad">${n.base != null ? M.addrStr(n.base) : 'invalid'}</span>${n.isRoot ? '' : '<button class="x" data-close title="Close">✕</button>'}</div>
    <div class="nb">${rows || '<div style="padding:10px 12px;color:var(--bad)">Address does not resolve</div>'}</div>
    <div class="nf"><button data-act="ins">＋ 8 bytes</button><button data-act="ins64">＋ 64</button><button data-act="rename">Rename class</button><span style="margin-left:auto;color:var(--faint);font:10px var(--mono);align-self:center">0x${M.hex(M.classSize(n.classId))}</span></div>`;
}

function render(force) {
  resolveAll();
  const linkSig = nodes.map(x => x.id + ':' + x.links.map(l => l.nodeId + l.key + (linkOk(l, x) ? '' : '~')).join(',') + (x.dupOf ? 'd' : '')).join('|');
  for (const n of nodes) {
    if (!n.el) { n.el = document.createElement('div'); n.el.className = 'node'; n.el.dataset.id = n.id; $('#world').appendChild(n.el); }
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    n.el.style.setProperty('--hue', hue(n.classId));
    n.el.classList.toggle('sel', n.id === selNode);
    const portSig = n.rows.map(r => { const p = portState(n, r); return p ? p.cls : ''; }).join();
    const sig = UI.sig(n.rows) + n.classId + n.base + linkSig + portSig;
    if (force || sig !== n.sig) {
      n.sig = sig; n.el.innerHTML = nodeHtml(n);
      n.rows.forEach(r => UI.changed(n.id + r.key, r.d.value));
    } else {
      const els = n.el.querySelectorAll('.r');
      n.rows.forEach((r, i) => {
        if (!UI.changed(n.id + r.key, r.d.value)) return;
        const v = els[i].querySelector('[data-v]');
        v.textContent = r.d.value; v.classList.remove('flash'); void v.offsetWidth; v.classList.add('flash');
      });
    }
  }
  drawWires(); drawMini(); renderInspector(); renderChrome();
}

function drawWires() {
  const out = [];
  for (const n of nodes) {
    n.links.forEach((l, i) => {
      const p = byId(l.nodeId);
      const row = p && p.el && p.el.querySelector(`.r[data-k="${CSS.escape(l.key)}"]`);
      if (!row) return;
      const anchor = !n.isRoot && i === 0;
      const t = portTarget(l), ok = sameInst(t, n);
      const enc = t && t.d.type === 'EncryptedPointer';
      const x1 = p.x + NODE_W, y1 = p.y + row.offsetTop + 12;
      const x2 = n.x, y2 = n.y + 21;
      const dx = Math.max(80, Math.abs(x2 - x1) * 0.5);
      const d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
      const name = t ? t.d.name : '?';
      const lx = (x1 + x2) / 2, ly = (y1 + y2) / 2 - 6;
      if (!ok) {
        out.push(`<path d="${d}" stroke="#ff6b7d" stroke-width="1.5" stroke-dasharray="3 5" opacity=".8"/>`);
        out.push(`<text class="lbl" style="fill:#ff6b7d" x="${lx}" y="${ly}" text-anchor="middle">${esc(name)} moved → ${t ? M.hex(t.base) : 'null'}</text>`);
        return;
      }
      out.push(`<path d="${d}" stroke="url(#${enc ? 'ge' : 'gp'})" ${enc ? 'stroke-dasharray="6 5"' : ''} stroke-width="${anchor ? 2 : 1.4}" opacity="${anchor ? .85 : .55}"/>`);
      out.push(`<circle cx="${x2}" cy="${y2}" r="${anchor ? 4 : 3}" fill="${enc ? '#8b7bff' : '#6bb6ff'}"/>`);
      out.push(`<text class="lbl" x="${lx}" y="${ly}" text-anchor="middle">${esc(name)}${enc ? ' · decrypted' : ''}${anchor ? '' : ' · shared'}</text>`);
    });
  }
  $('#wg').innerHTML = out.join('');
}

function applyView() {
  $('#world').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  const s = 22 * view.k;
  $('#stage').style.backgroundSize = `${s}px ${s}px`;
  $('#stage').style.backgroundPosition = `${view.x}px ${view.y}px`;
  $('#zLbl').textContent = Math.round(view.k * 100) + '%';
  drawMini();
}

// ---------------------------------------------------------------- node ops
// Click on a pointer port: unlink if linked; otherwise (with sharing on) link to
// the card that already shows the target instance; otherwise open a new card.
function follow(n, key) {
  const here = { nodeId: n.id, key };
  const L = linkedHere(n.id, key);
  if (L) {
    const stale = !linkOk(here, L);
    dropLink(L, L.links.findIndex(l => l.nodeId === n.id && l.key === key));
    if (!stale) return render(true);
  }
  const t = portTarget(here);
  if (!t) return render(true);
  const ex = shareCards && nodes.find(x => sameInst(x, t));
  if (ex) {
    ex.links.push(here);
    render(true); focusNode(ex);
    UI.toast(`${M.getClass(ex.classId).name} @ ${M.hex(ex.base)} is already open — linked to it`);
    return;
  }
  const row = n.el.querySelector(`.r[data-k="${CSS.escape(key)}"]`);
  let x = n.x + NODE_W + 140, y = n.y + row.offsetTop - 30;
  while (nodes.some(o => Math.abs(o.x - x) < NODE_W + 20 && y < o.y + (o.el ? o.el.offsetHeight : 420) + 20 && y + 120 > o.y)) y += 40;
  const c = makeNode(here, x, y);
  render(true);
  c.el.classList.add('pulse');
  ensureVisible(c);
}
function focusNode(n) {
  n.el.classList.remove('pulse'); void n.el.offsetWidth; n.el.classList.add('pulse');
  const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
  if (sx < 250 || sx + NODE_W * view.k > innerWidth - 300 || sy < 70 || sy > innerHeight - 200) {
    view.x = innerWidth / 2 - (n.x + NODE_W / 2) * view.k; view.y = 120 - n.y * view.k; applyView();
  }
}
function ensureVisible(n) {
  const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
  if (sx + NODE_W * view.k > innerWidth - 300) { view.x -= sx + NODE_W * view.k - (innerWidth - 300); }
  if (sy < 70) view.y += 70 - sy;
  applyView();
}
function depthOf(n) { let d = 0; for (let x = n; x && !x.isRoot && d < 64; d++) x = byId(anchorOf(x).nodeId); return d; }
function tidy() {
  // layered layout by anchor depth
  const cols = {};
  nodes.forEach(n => (cols[depthOf(n)] = cols[depthOf(n)] || []).push(n));
  Object.entries(cols).forEach(([d, list]) => {
    let y = 0;
    list.sort((a, b) => a.y - b.y).forEach(n => { n.x = d * (NODE_W + 140); n.y = y; y += n.el.offsetHeight + 40; });
  });
  render(true); fit();
}
function fit() {
  if (!nodes.length) return;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), x1 = Math.max(...xs) + NODE_W, y1 = Math.max(...nodes.map(n => n.y + n.el.offsetHeight));
  const aw = innerWidth - 560, ah = innerHeight - 140;
  view.k = Math.max(0.3, Math.min(1.2, Math.min(aw / (x1 - x0), ah / (y1 - y0))));
  view.x = 260 + (aw - (x1 - x0) * view.k) / 2 - x0 * view.k;
  view.y = 76 + (ah - (y1 - y0) * view.k) / 2 - y0 * view.k;
  applyView();
}

function drawMini() {
  const cv = $('#mini'), g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  if (!nodes.length) return;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min(...xs) - 200, y0 = Math.min(...ys) - 200, x1 = Math.max(...xs) + NODE_W + 200, y1 = Math.max(...nodes.map(n => n.y + (n.el ? n.el.offsetHeight : 300))) + 200;
  const s = Math.min(cv.width / (x1 - x0), cv.height / (y1 - y0));
  const tx = x => (x - x0) * s, ty = y => (y - y0) * s;
  g.strokeStyle = 'rgba(179,155,255,.5)'; g.lineWidth = 2;
  nodes.forEach(n => n.links.forEach(l => { const p = byId(l.nodeId); if (!p) return; g.beginPath(); g.moveTo(tx(p.x + NODE_W), ty(p.y + 40)); g.lineTo(tx(n.x), ty(n.y + 20)); g.stroke(); }));
  nodes.forEach(n => { g.fillStyle = hue(n.classId) + (n.id === selNode ? 'ff' : '99'); g.fillRect(tx(n.x), ty(n.y), NODE_W * s, (n.el ? n.el.offsetHeight : 300) * s); });
  g.strokeStyle = '#fff8'; g.lineWidth = 1.5;
  g.strokeRect(tx(-view.x / view.k), ty(-view.y / view.k), innerWidth / view.k * s, innerHeight / view.k * s);
  cv.onclick = e => { const r = cv.getBoundingClientRect(); const wx = (e.clientX - r.left) * cv.width / r.width / s + x0, wy = (e.clientY - r.top) * cv.height / r.height / s + y0; view.x = innerWidth / 2 - wx * view.k; view.y = innerHeight / 2 - wy * view.k; applyView(); };
}

M.on(what => render(what !== 'tick'));
addEventListener('resize', applyView);
applyView();
render(true);
// open a few cards so the canvas tells a story
const key = (n, name) => n.rows.find(r => r.d.name === name).key;
follow(root, key(root, 'localPlayer'));
const player = nodes[1];
follow(player, key(player, 'weapon'));
follow(root, key(root, 'camera'));
follow(root, key(root, 'entityList'));
const list = nodes[4];
list.expanded.add(key(list, 'entities')); render(true);
follow(list, list.rows.find(r => r.d.name === '[0]').key);   // → links to the existing Player card
follow(list, list.rows.find(r => r.d.name === '[1]').key);
tidy();
</script>
</body>
</html>
