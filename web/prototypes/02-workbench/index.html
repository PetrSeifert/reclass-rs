<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reclass-rs · Workbench</title>
<style>
  :root {
    --bg: #181818; --bg2: #1f1f1f; --bg3: #252526; --edge: #2b2b2b; --text: #cccccc; --dim: #8b8b8b; --faint: #5a5a5a;
    --accent: #0078d4; --accent2: #4daafc; --sel: #04395e; --hover: #2a2d2e; --focus: #0e639c;
    --k-hex: #9d9d9d; --k-int: #b5cea8; --k-float: #ce9178; --k-vec: #dcdcaa; --k-ptr: #c586c0; --k-text: #4ec9b0; --k-enum: #4fc1ff; --k-class: #4ec9b0; --k-bool: #569cd6;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --ui: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px var(--ui); overflow: hidden; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 48px 250px 1fr 300px; grid-template-rows: 1fr 22px; height: 100vh; }

  .activity { background: var(--bg2); border-right: 1px solid var(--edge); display: flex; flex-direction: column; align-items: center; padding-top: 4px; grid-row: 1; }
  .act { width: 48px; height: 48px; display: grid; place-items: center; color: var(--faint); cursor: pointer; border-left: 2px solid transparent; position: relative; }
  .act:hover { color: var(--text); }
  .act.on { color: #fff; border-left-color: #fff; }
  .act svg { width: 24px; height: 24px; }
  .act .badge { position: absolute; bottom: 9px; right: 8px; background: #c74e39; color: #fff; font-size: 9px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
  .act.bottom { margin-top: auto; }

  .side { background: var(--bg2); border-right: 1px solid var(--edge); display: flex; flex-direction: column; min-height: 0; }
  .side h2 { margin: 0; padding: 10px 20px 8px; font-size: 11px; font-weight: 400; letter-spacing: .05em; text-transform: uppercase; display: flex; align-items: center; }
  .side h2 .acts { margin-left: auto; display: flex; gap: 2px; }
  .ibtn { background: none; border: none; color: var(--text); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; display: inline-grid; place-items: center; }
  .ibtn:hover { background: #ffffff1a; }
  .sec { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; display: flex; gap: 4px; align-items: center; cursor: pointer; border-top: 1px solid var(--edge); }
  .sbody { overflow: auto; flex: 1; min-height: 0; }
  .ti { display: flex; align-items: center; gap: 6px; height: 22px; padding-right: 8px; cursor: pointer; white-space: nowrap; }
  .ti:hover { background: var(--hover); }
  .ti.on { background: var(--sel); outline: 1px solid var(--focus); outline-offset: -1px; }
  .ti .chev { width: 16px; text-align: center; color: var(--dim); font-size: 10px; flex: none; }
  .ti .ico { width: 16px; text-align: center; flex: none; font-size: 12px; }
  .ti .meta { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .ti .root { color: #e2c08d; font-size: 10px; border: 1px solid #e2c08d55; border-radius: 3px; padding: 0 3px; }
  .ti.dim .lbl { opacity: .5; }
  .sig-ok { color: #89d185; } .sig-bad { color: #f14c4c; }

  .center { display: grid; grid-template-rows: 35px auto 1fr 4px var(--panelH, 200px); min-width: 0; min-height: 0; }
  .tabs { display: flex; background: var(--bg2); overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border-right: 1px solid var(--edge); color: var(--dim); cursor: pointer; background: var(--bg2); white-space: nowrap; border-top: 1px solid transparent; }
  .tab.on { background: var(--bg); color: #fff; border-top-color: var(--accent); }
  .tab .x { visibility: hidden; border-radius: 4px; width: 18px; height: 18px; display: grid; place-items: center; }
  .tab:hover .x, .tab.on .x { visibility: visible; }
  .tab .x:hover { background: #ffffff1f; }
  .tab .ico { color: var(--k-class); }
  .tab.plus { color: var(--dim); border: none; }
  .crumbs { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-bottom: 1px solid var(--edge); font-size: 12px; color: var(--dim); background: var(--bg); }
  .crumbs .addr { display: flex; align-items: center; background: var(--bg3); border: 1px solid #3c3c3c; border-radius: 4px; padding: 0 0 0 8px; }
  .crumbs .addr:focus-within { border-color: var(--accent); }
  .crumbs .addr.bad { border-color: #be1100; }
  .crumbs input { background: none; border: none; outline: none; color: var(--text); font: 12px var(--mono); width: 260px; padding: 4px 6px; }
  .crumbs .res { font-family: var(--mono); color: #89d185; }
  .crumbs .res.bad { color: #f48771; }
  .crumbs .sp { flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2d2d2d; color: var(--dim); }

  .grid { overflow: auto; font: 12.5px var(--mono); min-height: 0; position: relative; outline: none; }
  table.g { border-collapse: separate; border-spacing: 0; width: 100%; }
  .g th { position: sticky; top: 0; background: var(--bg); text-align: left; font: 11px var(--ui); color: var(--dim); font-weight: 400; padding: 5px 10px; border-bottom: 1px solid var(--edge); z-index: 1; white-space: nowrap; }
  .g td { padding: 0 10px; height: 22px; white-space: nowrap; border-bottom: 1px solid #1f1f1f; }
  .g tr:hover td { background: #ffffff08; }
  .g tr.on td { background: var(--sel); }
  .g tr.on td:first-child { box-shadow: inset 2px 0 var(--accent2); }
  .g .off { color: var(--faint); width: 56px; }
  .g .ad { color: #6a9955; width: 120px; }
  .g .nm { color: #9cdcfe; }
  .g .nm .chev { display: inline-block; width: 14px; color: var(--dim); cursor: pointer; }
  .g .nm { line-height: 22px; }
  .g .nm .guide { display: inline-block; width: 16px; border-left: 1px solid #333; height: 22px; vertical-align: bottom; margin-left: 6px; margin-right: -6px; }
  .g .nm .anon { color: var(--faint); font-style: italic; }
  .g .ty span { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #ffffff0d; }
  .g .val { color: #e8e8e8; }
  .g .val.err { color: #f48771; }
  .g .val.flash { animation: fl .8s; }
  @keyframes fl { from { background: #613214; } to { background: transparent; } }
  .g .note { color: var(--faint); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  .g .sz { color: var(--faint); text-align: right; width: 40px; }
  .k-hex { color: var(--k-hex); } .k-int, .k-uint { color: var(--k-int); } .k-float { color: var(--k-float); } .k-vec { color: var(--k-vec); }
  .k-ptr { color: var(--k-ptr); } .k-text { color: var(--k-text); } .k-enum { color: var(--k-enum); } .k-class, .k-array { color: var(--k-class); } .k-bool { color: var(--k-bool); }
  .inline-edit { background: var(--bg3); color: #9cdcfe; border: 1px solid var(--accent); outline: none; font: 12.5px var(--mono); height: 20px; padding: 0 4px; }

  .hsplit { background: var(--edge); cursor: row-resize; }
  .panel { background: var(--bg); display: grid; grid-template-rows: 32px 1fr; min-height: 0; }
  .ptabs { display: flex; gap: 18px; padding: 0 16px; align-items: stretch; font-size: 11px; text-transform: uppercase; }
  .ptab { display: flex; align-items: center; color: var(--dim); cursor: pointer; border-bottom: 1px solid transparent; }
  .ptab.on { color: #e7e7e7; border-bottom-color: #e7e7e7; }
  .ptab .n { margin-left: 5px; background: #616161; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10px; }
  .pbody { overflow: auto; padding: 4px 16px; font: 12px var(--mono); }
  .pbody table { border-collapse: collapse; width: 100%; }
  .pbody td, .pbody th { text-align: left; padding: 3px 12px 3px 0; white-space: nowrap; }
  .pbody th { color: var(--dim); font: 11px var(--ui); }
  .log .t { color: var(--faint); margin-right: 8px; }
  .log .i { color: #3794ff; } .log .w { color: #cca700; } .log .e { color: #f14c4c; }

  .insp { background: var(--bg2); border-left: 1px solid var(--edge); overflow: auto; }
  .insp h3 { margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 10px 14px 6px; color: var(--dim); }
  .insp .card { padding: 0 14px 12px; }
  .insp .big { font: 16px var(--mono); color: #fff; word-break: break-all; }
  .insp .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .kv { display: grid; grid-template-columns: 70px 1fr; gap: 3px 10px; font: 12px var(--mono); }
  .kv div:nth-child(odd) { color: var(--dim); font-family: var(--ui); }
  .kv div:nth-child(even) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .field label { font-size: 11px; color: var(--dim); }
  .field input, .field select { background: var(--bg3); border: 1px solid #3c3c3c; color: var(--text); padding: 4px 6px; font: 12px var(--mono); outline: none; border-radius: 2px; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .bytes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; font: 12px var(--mono); }
  .bytes span { text-align: center; background: #ffffff08; padding: 2px 0; border-radius: 2px; }
  .bytes span.z { color: var(--faint); }
  .btn { background: var(--accent); color: #fff; border: none; padding: 5px 12px; border-radius: 2px; cursor: pointer; }
  .btn:hover { background: #026ec1; }
  .btn.sec2 { background: #313131; }
  .empty { color: var(--dim); padding: 20px 14px; line-height: 1.6; }
  kbd { font: 11px var(--mono); background: #333; border: 1px solid #444; border-bottom-width: 2px; padding: 0 4px; border-radius: 3px; }

  .status { grid-column: 1 / -1; background: var(--accent); color: #fff; display: flex; align-items: center; font-size: 12px; }
  .status > span { padding: 0 10px; height: 100%; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .status > span:hover { background: #ffffff1f; }
  .status .r { margin-left: auto; }
  .status .remote { background: #16825d; }

  .palette { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 600px; background: var(--bg2); border: 1px solid #454545; box-shadow: 0 8px 40px #000a; border-radius: 6px; z-index: 100; display: none; padding: 6px; }
  .palette.show { display: block; }
  .palette input { width: 100%; background: var(--bg3); border: 1px solid var(--accent); color: var(--text); padding: 6px 8px; font: 13px var(--ui); outline: none; border-radius: 3px; }
  .palette .list { max-height: 360px; overflow: auto; margin-top: 4px; }
  .palette .it { display: flex; padding: 5px 8px; border-radius: 3px; cursor: pointer; gap: 8px; }
  .palette .it.on { background: var(--sel); }
  .palette .it .cat { color: var(--dim); }
  .palette .it .kb { margin-left: auto; color: var(--dim); font: 11px var(--mono); }
  .palette b { color: var(--accent2); font-weight: 600; }

  .cm { background: var(--bg2); border: 1px solid #454545; border-radius: 6px; box-shadow: 0 4px 20px #000a; padding: 4px; min-width: 210px; font: 13px var(--ui); }
  .cm-item { display: flex; align-items: center; padding: 4px 26px 4px 26px; border-radius: 3px; position: relative; white-space: nowrap; cursor: default; }
  .cm-item:hover { background: var(--focus); color: #fff; }
  .cm-hint { margin-left: auto; padding-left: 24px; color: var(--dim); font: 11px var(--mono); }
  .cm-item:hover .cm-hint { color: #ddd; }
  .cm-arrow { position: absolute; right: 8px; }
  .cm-checked::before { content: '✓'; position: absolute; left: 9px; }
  .cm-danger .cm-label { color: #f48771; }
  .cm-disabled { opacity: .4; }
  .cm-sep { height: 1px; background: #454545; margin: 4px 8px; }
  .cm-header { padding: 4px 10px; color: var(--dim); font: 11px var(--mono); }
  .cm-sub { display: none; position: absolute; left: calc(100% + 2px); top: -5px; }
  .toast { position: fixed; bottom: 34px; right: 16px; background: var(--bg2); border: 1px solid #454545; padding: 10px 14px; border-radius: 4px; box-shadow: 0 4px 16px #0008; opacity: 0; transition: .2s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #79797966; } ::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <nav class="activity">
    <div class="act on" data-view="explorer" title="Classes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h7v6H4zM13 13h7v6h-7zM7.5 11v5.5H13"/></svg></div>
    <div class="act" data-view="sigs" title="Signatures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5"/></svg><span class="badge">1</span></div>
    <div class="act" data-view="enums" title="Enums"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 6h14M5 12h14M5 18h9"/><circle cx="18" cy="18" r="1.5"/></svg></div>
    <div class="act" data-view="modules" title="Modules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
    <div class="act" data-view="procs" title="Processes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M8 13h3M8 16h6"/></svg></div>
    <div class="act bottom" data-cmd="palette" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8l4 4-4 4M11 16h8"/></svg></div>
  </nav>
  <aside class="side" id="side"></aside>
  <main class="center">
    <div class="tabs" id="tabs"></div>
    <div class="crumbs" id="crumbs">
      <div class="addr" id="addrBox"><span style="color:var(--dim)">@</span><input id="expr" spellcheck="false"></div>
      <span class="res" id="res"></span><span class="sp"></span>
      <span class="pill" id="sizePill"></span>
    </div>
    <div class="grid" id="grid" tabindex="0"></div>
    <div class="hsplit" id="hsplit"></div>
    <section class="panel">
      <div class="ptabs" id="ptabs">
        <div class="ptab on" data-p="watch">Watch<span class="n" id="wN">0</span></div>
        <div class="ptab" data-p="problems">Problems<span class="n">1</span></div>
        <div class="ptab" data-p="output">Output</div>
      </div>
      <div class="pbody" id="pbody"></div>
    </section>
  </main>
  <aside class="insp" id="insp"></aside>
  <footer class="status">
    <span class="remote" id="stProc"></span>
    <span id="stSig">⊘ 1 &nbsp;⚠ 0</span>
    <span id="stLive"></span>
    <span class="r" id="stSel"></span>
    <span>x64 · LE</span>
    <span>reclass-rs 0.2.0</span>
  </footer>
</div>
<div class="palette" id="palette"><input id="pin" placeholder="Type a command, class, or field…" spellcheck="false"><div class="list" id="plist"></div></div>

<script src="../shared/model.js"></script>
<script src="../shared/ui.js"></script>
<script>
const M = Model, $ = s => document.querySelector(s), esc = UI.esc;
const PRESET = { 1: '[$GWorld]', 2: '[[$GWorld] + 0x8]', 3: '[[[$GWorld] + 0x8] + 0x40]', 4: '[[$GWorld] + 0x10]', 5: '0x1F3A8F08800', 6: '[$GWorld] + 0x100' };
const tabs = [
  { classId: 1, expr: PRESET[1], expanded: new Set(['/' + M.getClass(1).fields[2].id]) },
  { classId: 2, expr: PRESET[2], expanded: new Set() },
];
let active = 0, rows = [], rowEls = new Map(), lastSig = '', selKey = null, sideView = 'explorer', ptab = 'watch';
const watches = [];
const logs = [];
const tab = () => tabs[active];
function log(level, msg) { logs.push([new Date().toLocaleTimeString(), level, msg]); if (ptab === 'output') renderPanel(); }
log('i', 'Attached to Hollowfield.exe (PID 6716) via vtd-libum');
log('i', 'Resolved 3/4 signatures in 38 ms');
log('e', "Signature 'ViewMatrix' in Hollowfield.exe: pattern not found");
log('i', 'Loaded memory_structure.json (6 classes, 3 enums)');

// ---------------------------------------------------------------- side views
function renderSide() {
  document.querySelectorAll('.act[data-view]').forEach(a => a.classList.toggle('on', a.dataset.view === sideView));
  const s = $('#side');
  if (sideView === 'explorer') {
    s.innerHTML = `<h2>Explorer<span class="acts"><button class="ibtn" id="newCls" title="New class">＋</button><button class="ibtn" id="collapseAll" title="Collapse">⊟</button></span></h2>
      <div class="sec">▾ Classes <span style="margin-left:auto;font-weight:400;color:var(--dim)">${M.classes.length}</span></div>
      <div class="sbody" id="clsTree">${M.classes.map(c => {
        const open = openClasses.has(c.id), refs = M.classRefs(c.id);
        return `<div class="ti ${tab() && tab().classId === c.id ? 'on' : ''} ${refs ? '' : 'dim'}" data-cls="${c.id}" style="padding-left:8px">
          <span class="chev" data-tg>${open ? '▾' : '▸'}</span><span class="ico k-class">◆</span><span class="lbl">${esc(c.name)}</span>
          ${c.id === M.state.rootClassId ? '<span class="root">ROOT</span>' : ''}<span class="meta">0x${M.hex(M.classSize(c.id))}</span></div>` +
          (open ? c.fields.map(f => `<div class="ti" data-cls="${c.id}" data-fld="${f.id}" style="padding-left:30px"><span class="ico k-${M.TYPES[f.type].cat}">•</span>
            <span class="lbl">${f.name ? esc(f.name) : '<span style="color:var(--faint)">' + M.SHORT[f.type] + '</span>'}</span><span class="meta">+${M.hex(f.offset)}</span></div>`).join('') : '');
      }).join('')}</div>`;
    $('#newCls').onclick = () => { const c = M.addClass(); openTab(c.id); log('i', 'Created class ' + c.name); };
    $('#collapseAll').onclick = () => { openClasses.clear(); renderSide(); };
    $('#clsTree').onclick = e => {
      const ti = e.target.closest('.ti'); if (!ti) return;
      const cid = +ti.dataset.cls;
      if (e.target.dataset.tg !== undefined) { openClasses.has(cid) ? openClasses.delete(cid) : openClasses.add(cid); return renderSide(); }
      openTab(cid);
      if (ti.dataset.fld) { const k = '/' + ti.dataset.fld; select(k, true); }
    };
    $('#clsTree').oncontextmenu = e => {
      const ti = e.target.closest('.ti[data-cls]:not([data-fld])'); if (!ti) return; e.preventDefault();
      const cid = +ti.dataset.cls, c = M.getClass(cid);
      UI.contextMenu(e.clientX, e.clientY, [
        { label: 'Open in new tab', onClick: () => openTab(cid, true) },
        { label: 'Set as root class', onClick: () => { M.state.rootClassId = cid; renderSide(); log('i', c.name + ' is now the root class'); } },
        { label: 'Rename…', hint: 'F2', onClick: () => UI.inlineEdit(ti.querySelector('.lbl'), c.name, v => M.renameClass(cid, v)) },
        { sep: true }, { label: 'Delete class', danger: true, disabled: M.classRefs(cid) > 0, onClick: () => M.removeClass(cid) },
      ]);
    };
  } else if (sideView === 'sigs') {
    s.innerHTML = `<h2>Signatures<span class="acts"><button class="ibtn" title="Rescan" onclick="log('i','Rescanned signatures');UI.toast('Rescanned')">⟳</button><button class="ibtn" title="Add">＋</button></span></h2><div class="sbody">` +
      M.signatures.map(g => `<div style="padding:8px 14px;border-bottom:1px solid var(--edge)"><div style="display:flex;gap:6px;align-items:center"><span class="${g.error ? 'sig-bad' : 'sig-ok'}">${g.error ? '✕' : '✓'}</span><b style="font-family:var(--mono);font-weight:500">$${g.name}</b><span style="margin-left:auto;color:var(--dim);font-size:11px">${g.module}</span></div>
        <div style="font:11px var(--mono);color:var(--dim);margin:4px 0;word-break:break-all">${g.pattern}</div>
        <div style="font:11px var(--mono)" class="${g.error ? 'sig-bad' : ''}">${g.error ? g.error : '→ 0x' + M.addrStr(g.value)} <span style="color:var(--faint)">off ${g.offset} · len ${g.instLen}</span></div></div>`).join('') + '</div>';
  } else if (sideView === 'enums') {
    s.innerHTML = `<h2>Enums<span class="acts"><button class="ibtn">＋</button></span></h2><div class="sbody">` + M.enums.map(e =>
      `<div class="ti" style="padding-left:8px"><span class="chev">▾</span><span class="ico k-enum">≡</span>${e.name}<span class="meta">${e.isFlags ? 'flags · ' : ''}u${e.size * 8}</span></div>` +
      e.variants.map(([k, v]) => `<div class="ti" style="padding-left:40px"><span class="lbl">${k}</span><span class="meta">${e.isFlags ? '0x' + M.hex(v) : v}</span></div>`).join('')).join('') + '</div>';
  } else if (sideView === 'modules') {
    s.innerHTML = `<h2>Modules</h2><div class="sbody">` + M.MODULES.map(m =>
      `<div class="ti" style="padding-left:14px;height:auto;padding-top:4px;padding-bottom:4px;flex-wrap:wrap" title="${esc(m.path)}" data-mod="${m.name}"><span class="ico">▣</span><span>${m.name}</span><span class="meta">0x${M.hex(m.size)}</span><div style="width:100%;padding-left:22px;font:11px var(--mono);color:#6a9955">${M.addrStr(m.base)}</div></div>`).join('') + '</div>';
    s.querySelector('.sbody').ondblclick = e => { const t = e.target.closest('[data-mod]'); if (t) { $('#expr').value += ' <' + t.dataset.mod + '>'; setExpr($('#expr').value); } };
  } else if (sideView === 'procs') {
    s.innerHTML = `<h2>Attach to process</h2><div style="padding:0 12px 8px"><input id="pflt" placeholder="Filter" style="width:100%;background:var(--bg3);border:1px solid #3c3c3c;color:var(--text);padding:4px 6px"></div><div class="sbody" id="plst"></div>`;
    const draw = () => { const q = $('#pflt').value.toLowerCase(); $('#plst').innerHTML = M.processes.filter(p => (p.name + p.pid).toLowerCase().includes(q)).map(p => `<div class="ti ${p.pid === M.state.pid ? 'on' : ''}" data-pid="${p.pid}" style="padding-left:14px"><span class="ico">⬚</span>${p.name}<span class="meta">${p.pid}</span></div>`).join(''); };
    draw(); $('#pflt').oninput = draw;
    $('#plst').onclick = e => { const t = e.target.closest('[data-pid]'); if (t) { M.attach(+t.dataset.pid); log('i', 'Attached to PID ' + t.dataset.pid); renderSide(); } };
  }
}
const openClasses = new Set([1]);
document.querySelectorAll('.act[data-view]').forEach(a => a.onclick = () => { sideView = a.dataset.view; renderSide(); });

// ---------------------------------------------------------------- tabs & editor
function openTab(cid, newTab) {
  let i = tabs.findIndex(t => t.classId === cid);
  if (i < 0 || newTab) { tabs.push({ classId: cid, expr: PRESET[cid] || '0x0', expanded: new Set() }); i = tabs.length - 1; }
  active = i; selKey = null; renderTabs(); render(true); renderSide();
}
function renderTabs() {
  $('#tabs').innerHTML = tabs.map((t, i) => `<div class="tab ${i === active ? 'on' : ''}" data-i="${i}"><span class="ico">◆</span>${esc(M.getClass(t.classId)?.name || '?')}<span class="x" data-x>✕</span></div>`).join('') + '<div class="tab plus" id="plusTab" title="Open class">＋</div>';
  $('#expr').value = tab() ? tab().expr : '';
}
$('#tabs').onclick = e => {
  if (e.target.id === 'plusTab') return openPalette('Go to class: ');
  const t = e.target.closest('.tab'); if (!t) return;
  const i = +t.dataset.i;
  if (e.target.dataset.x !== undefined) { tabs.splice(i, 1); active = Math.min(active, tabs.length - 1); }
  else active = i;
  selKey = null; renderTabs(); render(true); renderSide();
};
function setExpr(v) { tab().expr = v; render(true); }
$('#expr').oninput = e => setExpr(e.target.value);

function rowHtml(r) {
  const d = r.d, f = d.field;
  const guides = '<span class="guide"></span>'.repeat(r.depth);
  const chev = d.expandable ? `<span class="chev" data-tg>${r.open ? '▾' : '▸'}</span>` : '<span class="chev"></span>';
  const nm = f.name ? `<span data-name>${esc(f.name)}</span>` : `<span class="anon">${M.SHORT[f.type]}_${M.hex(d.offset, 2)}</span>`;
  return `<tr data-k="${r.key}" class="${r.key === selKey ? 'on' : ''}">
    <td class="off">${M.offStr(d.offset)}</td><td class="ad">${M.addrStr(d.addr)}</td>
    <td class="nm">${guides}${chev}${nm}</td>
    <td class="ty"><span class="k-${d.cat}">${esc(d.typeLabel)}</span></td>
    <td class="val ${d.error ? 'err' : ''}" data-v>${esc(d.value)}</td>
    <td class="note" data-h>${esc(d.hints.join('  ·  '))}</td>
    <td class="sz">${d.size}</td></tr>`;
}
function render(force) {
  const t = tab();
  if (!t) { $('#grid').innerHTML = '<div class="empty">No class open.<br>Press <kbd>Ctrl</kbd>+<kbd>K</kbd> and type a class name.</div>'; rows = []; renderInspector(); return; }
  const r = M.evalExpr(t.expr);
  $('#addrBox').classList.toggle('bad', !r.ok);
  $('#res').className = 'res' + (r.ok ? '' : ' bad');
  $('#res').textContent = r.ok ? '→ 0x' + M.addrStr(r.value) + (M.symbolize(r.value) && M.symbolize(r.value) !== 'heap' ? '  (' + M.symbolize(r.value) + ')' : '') : r.error;
  $('#sizePill').textContent = M.getClass(t.classId).name + ' · 0x' + M.hex(M.classSize(t.classId)) + ' bytes';
  rows = UI.flatten(t.classId, r.ok ? r.value : null, t.expanded);
  const sig = active + UI.sig(rows);
  if (force || sig !== lastSig) {
    lastSig = sig;
    $('#grid').innerHTML = `<table class="g"><thead><tr><th>Offset</th><th>Address</th><th>Name</th><th>Type</th><th>Value</th><th>Notes</th><th style="text-align:right">Size</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table>` + (r.ok ? '' : '<div class="empty">Address expression is invalid.</div>');
    rowEls.clear(); $('#grid').querySelectorAll('tr[data-k]').forEach(el => rowEls.set(el.dataset.k, el));
    rows.forEach(r => UI.changed(active + r.key, r.d.value));
  } else {
    for (const r of rows) {
      if (!UI.changed(active + r.key, r.d.value)) continue;
      const el = rowEls.get(r.key), v = el.querySelector('[data-v]');
      v.textContent = r.d.value; v.classList.remove('flash'); void v.offsetWidth; v.classList.add('flash');
      el.querySelector('[data-h]').textContent = r.d.hints.join('  ·  ');
    }
  }
  renderInspector(); renderStatus();
  if (ptab === 'watch') renderPanel();
}
const selected = () => rows.find(r => r.key === selKey);
function select(k, scroll) {
  selKey = k;
  rowEls.forEach((el, kk) => el.classList.toggle('on', kk === k));
  if (scroll) rowEls.get(k)?.scrollIntoView({ block: 'nearest' });
  renderInspector(); renderStatus();
}
const grid = $('#grid');
grid.addEventListener('mousedown', e => {
  const tr = e.target.closest('tr[data-k]'); if (!tr) return;
  if (e.target.dataset.tg !== undefined) return toggle(tr.dataset.k);
  select(tr.dataset.k);
});
grid.addEventListener('dblclick', e => {
  const tr = e.target.closest('tr[data-k]'); if (!tr) return;
  const r = selected();
  if (e.target.closest('.nm')) rename(r); else if (r.d.expandable) toggle(r.key);
});
grid.addEventListener('contextmenu', e => {
  const tr = e.target.closest('tr[data-k]'); if (!tr) return; e.preventDefault();
  select(tr.dataset.k); const r = selected();
  const items = UI.fieldMenuItems(r.classId, r.d, { onRename: () => rename(r) });
  items.splice(1, 0, { label: 'Add to watch', hint: 'W', onClick: () => addWatch(r) });
  if (r.d.child && r.d.child.classId) items.splice(2, 0, { label: 'Open target in new tab', onClick: () => { tabs.push({ classId: r.d.child.classId, expr: '0x' + M.hex(r.d.child.base), expanded: new Set() }); active = tabs.length - 1; renderTabs(); render(true); } });
  UI.contextMenu(e.clientX, e.clientY, items);
});
function toggle(k) { const s = tab().expanded; s.has(k) ? s.delete(k) : s.add(k); render(true); }
function rename(r) {
  if (!r || r.classId == null) return;
  const el = rowEls.get(r.key).querySelector('.nm [data-name], .nm .anon');
  UI.inlineEdit(el, r.d.field.name, v => { M.renameField(r.classId, r.d.field.id, v); log('i', `Renamed field +0x${M.hex(r.d.offset)} → ${v}`); });
}
grid.addEventListener('keydown', e => {
  const i = rows.findIndex(r => r.key === selKey), r = rows[i];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) select(n.key, true); }
  if (!r) return;
  if ((e.key === 'ArrowRight' && !r.open) || (e.key === 'ArrowLeft' && r.open) || e.key === 'Enter') r.d.expandable && toggle(r.key);
  if (e.key === 'F2') { e.preventDefault(); rename(r); }
  if (e.key === 'Delete' && r.classId != null) M.removeField(r.classId, r.d.field.id);
  if (e.key === 'w') addWatch(r);
  if (e.key === 't') openPalette('Change type: ');
});

// ---------------------------------------------------------------- inspector
function interp(d) {
  const b = M.read(d.addr, 8);
  if (!b) return [];
  const v = new DataView(b.buffer);
  const p = Number(v.getBigUint64(0, true));
  return [
    ['i8 / u8', v.getInt8(0) + ' / ' + v.getUint8(0)], ['i16', v.getInt16(0, true)], ['i32', v.getInt32(0, true)], ['u32', v.getUint32(0, true)],
    ['i64', v.getBigInt64(0, true).toString()], ['f32', M.fmtFloat(v.getFloat32(0, true))], ['f64', M.fmtFloat(v.getFloat64(0, true))],
    ['ptr', M.readable(p) ? M.addrStr(p) + ' ' + (M.symbolize(p) || '') : '—'], ['ascii', M.ascii(b)],
  ];
}
let inspKey = null;
function renderInspector() {
  const r = selected(), el = $('#insp');
  if (!r) { inspKey = null; el.innerHTML = '<h3>Inspector</h3><div class="empty">Select a field.<br><br><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> expand<br><kbd>F2</kbd> rename · <kbd>t</kbd> change type<br><kbd>w</kbd> watch · <kbd>Del</kbd> remove<br><kbd>Ctrl</kbd>+<kbd>K</kbd> command palette</div>'; return; }
  const d = r.d, editable = r.classId != null;
  if (inspKey === r.key + d.typeLabel + d.name && el.contains(document.activeElement)) { el.querySelector('[data-live]').textContent = d.value; return; }
  inspKey = r.key + d.typeLabel + d.name;
  const bytes = d.bytes ? Array.from(d.bytes.slice(0, 16), x => `<span class="${x ? '' : 'z'}">${M.hex(x, 2)}</span>`).join('') : '';
  const targets = (d.type === 'Pointer' || d.type === 'EncryptedPointer' || d.type === 'ClassInstance') && editable
    ? `<div class="field"><label>Points to</label><select id="iTarget">${M.classes.map(c => `<option value="${c.id}" ${d.field.target && d.field.target.classId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>` : '';
  el.innerHTML = `<h3>Field</h3><div class="card">
      <div class="big" data-live>${esc(d.value)}</div><div class="sub">${esc(d.hints.join(' · ')) || '&nbsp;'}</div></div>
    <div class="card">
      <div class="field"><label>Name</label><input id="iName" value="${esc(d.field.name || '')}" placeholder="(unnamed hex)" ${editable ? '' : 'disabled'}></div>
      <div class="field"><label>Type</label><select id="iType" ${editable ? '' : 'disabled'}>${M.TYPE_GROUPS.map(([g, ts]) => `<optgroup label="${g}">${ts.map(t => `<option ${t === d.type ? 'selected' : ''}>${t}</option>`).join('')}</optgroup>`).join('')}</select></div>
      ${targets}
      <div style="display:flex;gap:6px"><button class="btn" id="iWatch">Add to watch</button><button class="btn sec2" id="iCopy">Copy address</button></div>
    </div>
    <h3>Location</h3><div class="card kv"><div>address</div><div>${M.addrStr(d.addr)}</div><div>offset</div><div>+0x${M.hex(d.offset)}</div><div>size</div><div>${d.size} bytes</div><div>class</div><div>${r.classId != null ? esc(M.getClass(r.classId).name) : '(array element)'}</div></div>
    <h3>Bytes</h3><div class="card"><div class="bytes">${bytes}</div></div>
    <h3>Interpretations</h3><div class="card kv">${interp(d).map(([k, v]) => `<div>${k}</div><div title="${esc(v)}">${esc(v)}</div>`).join('')}</div>`;
  if (editable) {
    $('#iName').onchange = e => M.renameField(r.classId, d.field.id, e.target.value);
    $('#iType').onchange = e => { M.setFieldType(r.classId, d.field.id, e.target.value); log('i', `+0x${M.hex(d.offset)} → ${e.target.value}`); };
    if ($('#iTarget')) $('#iTarget').onchange = e => M.patchField(r.classId, d.field.id, { target: { classId: +e.target.value } });
  }
  $('#iWatch').onclick = () => addWatch(r);
  $('#iCopy').onclick = () => UI.copy(M.addrStr(d.addr));
}

// ---------------------------------------------------------------- bottom panel
function addWatch(r) {
  const f = Object.assign({}, r.d.field, { offset: 0 });
  const path = M.getClass(tab().classId).name + r.key.split('/').slice(1).map(id => '.' + (findFieldName(+id) || '?')).join('');
  watches.push({ label: path, addr: r.d.addr, field: f });
  ptab = 'watch'; renderPanel(); UI.toast('Watching ' + path);
}
function findFieldName(id) { for (const c of M.classes) for (const f of c.fields) if (f.id === id) return f.name || M.SHORT[f.type]; return null; }
function renderPanel() {
  document.querySelectorAll('.ptab').forEach(p => p.classList.toggle('on', p.dataset.p === ptab));
  $('#wN').textContent = watches.length;
  const b = $('#pbody');
  if (ptab === 'watch') {
    b.innerHTML = watches.length ? `<table><tr><th>Expression</th><th>Address</th><th>Type</th><th>Value</th><th></th></tr>` + watches.map((w, i) => {
      const d = M.describe(w.field, w.addr);
      return `<tr><td style="color:#9cdcfe">${esc(w.label)}</td><td style="color:#6a9955">${M.addrStr(w.addr)}</td><td class="k-${d.cat}">${esc(d.typeLabel)}</td><td>${esc(d.value)}</td><td><button class="ibtn" data-rm="${i}">✕</button></td></tr>`;
    }).join('') + '</table>' : '<div style="color:var(--dim);padding:8px 0;font-family:var(--ui)">Right-click a field → <i>Add to watch</i> (or press <kbd>w</kbd>) to pin live values here.</div>';
    b.querySelectorAll('[data-rm]').forEach(x => x.onclick = () => { watches.splice(+x.dataset.rm, 1); renderPanel(); });
  } else if (ptab === 'problems') {
    b.innerHTML = M.signatures.filter(s => s.error).map(s => `<div class="log"><span class="e">✕</span> $${s.name} <span style="color:var(--dim)">${s.module}</span> — ${s.error} <span style="color:var(--faint)">[${s.pattern}]</span></div>`).join('');
  } else {
    b.innerHTML = '<div class="log">' + logs.map(([t, l, m]) => `<div><span class="t">${t}</span><span class="${l}">[${{ i: 'info', w: 'warn', e: 'error' }[l]}]</span> ${esc(m)}</div>`).join('') + '</div>';
    b.scrollTop = 1e9;
  }
}
$('#ptabs').onclick = e => { const p = e.target.closest('.ptab'); if (p) { ptab = p.dataset.p; renderPanel(); } };
$('#hsplit').onmousedown = e => {
  const c = $('.center'), y0 = e.clientY, h0 = $('.panel').offsetHeight;
  const mv = ev => c.style.setProperty('--panelH', Math.max(60, Math.min(500, h0 - (ev.clientY - y0))) + 'px');
  addEventListener('mousemove', mv); addEventListener('mouseup', () => removeEventListener('mousemove', mv), { once: true });
};

function renderStatus() {
  const p = M.process();
  $('#stProc').innerHTML = M.state.attached ? `⛓ ${p.name} · ${p.pid}` : '⛓ not attached';
  $('#stLive').innerHTML = M.state.paused ? '⏸ Paused' : '● Live 4 Hz';
  const r = selected();
  $('#stSel').textContent = r ? `+0x${M.hex(r.d.offset)} · ${M.addrStr(r.d.addr)} · ${r.d.size}B` : '';
}
$('#stLive').onclick = () => { M.setLive(M.state.paused); renderStatus(); };
$('#stProc').onclick = () => { sideView = 'procs'; renderSide(); };
$('#stSig').onclick = () => { ptab = 'problems'; renderPanel(); };

// ---------------------------------------------------------------- command palette
const commands = () => {
  const r = selected(), list = [];
  M.classes.forEach(c => list.push({ cat: 'Go to class', label: c.name, run: () => openTab(c.id) }));
  if (r && r.classId != null) M.TYPE_GROUPS.forEach(([, ts]) => ts.forEach(t => list.push({ cat: 'Change type', label: t, kb: M.TYPES[t].size ? M.TYPES[t].size + 'B' : '', run: () => M.setFieldType(r.classId, r.d.field.id, t) })));
  rows.forEach(x => x.d.name && list.push({ cat: 'Go to field', label: x.d.name + '  +0x' + M.hex(x.d.offset), run: () => select(x.key, true) }));
  list.push({ cat: 'Class', label: 'New class', run: () => $('#newCls')?.click() || M.addClass() });
  list.push({ cat: 'Process', label: 'Attach to process…', run: () => { sideView = 'procs'; renderSide(); } });
  list.push({ cat: 'View', label: M.state.paused ? 'Resume live updates' : 'Pause live updates', kb: 'Ctrl+.', run: () => $('#stLive').click() });
  list.push({ cat: 'View', label: 'Show signatures', run: () => { sideView = 'sigs'; renderSide(); } });
  list.push({ cat: 'File', label: 'Save project', kb: 'Ctrl+S', run: () => UI.toast('Saved memory_structure.json') });
  list.push({ cat: 'File', label: 'Export as Rust structs', run: () => UI.toast('Copied Rust structs') });
  return list;
};
let pItems = [], pIdx = 0;
function openPalette(prefix) { $('#palette').classList.add('show'); $('#pin').value = prefix || ''; $('#pin').focus(); filterPalette(); }
function closePalette() { $('#palette').classList.remove('show'); grid.focus(); }
function filterPalette() {
  const q = $('#pin').value.toLowerCase().trim();
  pItems = commands().filter(c => (c.cat + ': ' + c.label).toLowerCase().includes(q)).slice(0, 60);
  pIdx = 0; drawPalette();
}
function drawPalette() {
  $('#plist').innerHTML = pItems.map((c, i) => `<div class="it ${i === pIdx ? 'on' : ''}" data-i="${i}"><span class="cat">${c.cat}:</span><span>${esc(c.label)}</span><span class="kb">${c.kb || ''}</span></div>`).join('') || '<div class="it" style="color:var(--dim)">No matching commands</div>';
  $('#plist').querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}
$('#pin').oninput = filterPalette;
$('#pin').onkeydown = e => {
  if (e.key === 'ArrowDown') { pIdx = Math.min(pItems.length - 1, pIdx + 1); drawPalette(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { pIdx = Math.max(0, pIdx - 1); drawPalette(); e.preventDefault(); }
  if (e.key === 'Enter' && pItems[pIdx]) { const c = pItems[pIdx]; closePalette(); c.run(); }
  if (e.key === 'Escape') closePalette();
};
$('#plist').onclick = e => { const it = e.target.closest('[data-i]'); if (it) { const c = pItems[+it.dataset.i]; closePalette(); c.run(); } };
$('#pin').onblur = () => setTimeout(closePalette, 150);
document.querySelector('[data-cmd=palette]').onclick = () => openPalette();
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'p')) { e.preventDefault(); openPalette(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); UI.toast('Saved memory_structure.json'); }
});

M.on(what => {
  if (what === 'tick') return render(false);
  renderTabs(); render(true); renderSide();
});
renderSide(); renderTabs(); render(true); renderPanel();
select(rows[2].key);
watches.push({ label: 'GameWorld.localPlayer.health', addr: 0x1F3A8D12400 + 0x2C, field: { id: -5, type: 'Float', name: 'health', offset: 0 } });
watches.push({ label: 'GameWorld.localPlayer.position', addr: 0x1F3A8D12400 + 0x10, field: { id: -6, type: 'Vector3', name: 'position', offset: 0 } });
renderPanel();
grid.focus();
</script>
